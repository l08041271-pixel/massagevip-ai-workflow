name: Scheduled Automation Agent

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-agent
  cancel-in-progress: true

jobs:
  agent-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check production health
        env:
          HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 20 "$HEALTH_URL"

      - name: Run metrics/agent cycle
        env:
          METRICS_URL: ${{ secrets.PRODUCTION_METRICS_URL }}
          AGENT_TOKEN: ${{ secrets.AGENT_CRON_TOKEN }}
        run: |
          if [ -n "$METRICS_URL" ]; then
            curl --fail --silent --show-error --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer $AGENT_TOKEN" \
              "$METRICS_URL"
          else
            echo "PRODUCTION_METRICS_URL is not configured; health check completed."
          fi
