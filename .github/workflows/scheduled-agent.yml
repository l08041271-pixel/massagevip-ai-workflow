name: Scheduled Automation Agent

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-agent
  cancel-in-progress: true

jobs:
  agent-cycle:
    if: ${{ secrets.PRODUCTION_HEALTH_URL != '' && secrets.PRODUCTION_AGENT_URL != '' && secrets.AGENT_CRON_TOKEN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check production health
        env:
          HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 20 "$HEALTH_URL"

      - name: Execute protected agent cycle
        env:
          AGENT_URL: ${{ secrets.PRODUCTION_AGENT_URL }}
          AGENT_TOKEN: ${{ secrets.AGENT_CRON_TOKEN }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $AGENT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"source":"github-actions","trigger":"scheduled"}' \
            "$AGENT_URL"
