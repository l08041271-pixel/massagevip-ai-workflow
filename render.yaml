project: massagevip-ai-prod

services:
  # Main automation worker (free tier: web service)
  - type: web
    name: automation-worker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WAHA_BASE_URL
        sync: false
      - key: WAHA_SESSION
        value: default
      - key: WAHA_API_KEY
        sync: false
      - key: WAHA_WEBHOOK_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: massagevip-db
    plan: free
    databaseName: massagevip
    user: app
