project: massagevip-ai-prod

services:
  # WhatsApp gateway via WAHA
  - type: docker
    name: waha
    plan: starter
    dockerfilePath: ./Dockerfile.waha
    dockerContext: .
    envVars:
      - key: WHATSAPP_HOOK_URL
        value: https://massagevip-automation.onrender.com/webhook
      - key: WHATSAPP_HOOK_EVENTS
        value: "*"
      - key: WAHA_API_KEY
        sync: false
      - key: WAHA_WEBHOOK_SECRET
        sync: false

  # Main automation worker
  - type: worker
    name: automation-worker
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WAHA_BASE_URL
        value: http://waha:3000
      - key: WAHA_SESSION
        value: default
      - key: WAHA_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: massagevip-db
    plan: basic-256mb
    databaseName: massagevip
    user: app
