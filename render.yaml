project: massagevip-ai-prod

services:
  - type: worker
    name: automation-worker
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: PORT
        value: "8080"
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: massagevip-db
    plan: basic-256mb
    databaseName: massagevip
    user: app
