project: massagevip-ai-prod

services:
  # 24/7 Workflow runtime (process_lead, agents)
  - type: worker
    name: main-worker
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

  # Hunter cron every 15 min
  - type: cron
    name: night-shift-cron
    env: python
    schedule: "*/15 * * * *"
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python night_shift.py
    envVars:
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: massagevip-db
    plan: basic-256mb
    databaseName: massagevip
    user: app
