project: massagevip-ai-prod

services:
  # Main automation worker (free tier: web service)
  - type: web
    name: automation-worker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WAHA_BASE_URL
        sync: false
      - key: WAHA_SESSION
        value: default
      - key: WAHA_API_KEY
        sync: false
      - key: WAHA_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_PROVIDER
        sync: false
      - key: YCLOUD_API_BASE_URL
        sync: false
      - key: YCLOUD_API_KEY
        sync: false
      - key: YCLOUD_FROM
        sync: false
      - key: YCLOUD_WEBHOOK_SECRET
        sync: false
      - key: YCLOUD_WEBHOOK_ENDPOINT_ID
        sync: false
      - key: YCLOUD_WEBHOOK_TOLERANCE_SECONDS
        value: "300"
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: massagevip-db
    plan: free
    databaseName: massagevip
    user: app
