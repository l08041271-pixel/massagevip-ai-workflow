project: massagevip-ai-prod

services:
  # Main automation worker (free tier: web service)
  - type: web
    name: automation-worker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4.1-mini
      - key: AI_API_MODE
        value: responses
      - key: AI_TRACING_ENABLED
        value: false
      - key: DATABASE_URL
        sync: false
      - key: WAHA_BASE_URL
        sync: false
      - key: WAHA_SESSION
        value: default
      - key: WAHA_API_KEY
        sync: false
      - key: WAHA_WEBHOOK_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: massagevip-db
    plan: free
    databaseName: massagevip
    user: app
